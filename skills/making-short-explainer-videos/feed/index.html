<meta charset="utf-8">
<title>Explainer Shorts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-height snap screen per part — a 16:9 video, its notes under it. Single dark look, matched to the videos. */
:root {
  color-scheme: dark;
  --bg: #0b0f17;
  --panel: #161b26;
  --line: #2b3446;
  --fg: #eef2f8;
  --fg-2: #b9c2d2;
  --fg-3: #8590a6;
  --amber: #f5b041;
  --purple: #be8cff;
  --blue: #64aaff;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; overflow: hidden; }
.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; }
.slide {
  height: 100%; scroll-snap-align: start; scroll-snap-stop: always; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 16px max(56px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
.frame {
  position: relative; aspect-ratio: 16 / 9; width: min(100%, calc((100dvh - 150px) * 16 / 9));
  border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line);
}
.frame video { width: 100%; height: 100%; display: block; object-fit: contain; cursor: pointer; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgb(255 255 255 / 0.12); }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); }
.state, .ask { position: absolute; left: 0; right: 0; display: grid; place-items: center; pointer-events: none; }
.state { inset: 0; }
.state[hidden], .ask[hidden] { display: none; }
.state span {
  background: rgb(11 15 23 / 0.78); border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 18px; font-weight: 600; font-size: 14px;
}
/* Sits over the caption band: the narration is stopped, and the guess options stay visible above it. */
.ask { bottom: 4%; }
.ask span {
  background: rgb(11 15 23 / 0.92); border: 2px solid var(--purple); border-radius: 999px;
  padding: 12px 22px; font-weight: 600; font-size: clamp(13px, 1.4vw, 18px); color: var(--fg);
}
.ask b { color: var(--purple); }
.notes {
  width: min(100%, calc((100dvh - 150px) * 16 / 9)); display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 4px 16px; min-width: 0;
}
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
.eyebrow b { color: var(--amber); font-weight: 500; }
h1, h2 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; }
.notes p { margin: 0; color: var(--fg-2); line-height: 1.45; flex-basis: 100%; }
.files { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
.files code {
  font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; overflow-wrap: anywhere;
}
.real { margin-left: 6px; padding: 1px 7px; border-radius: 999px; border: 1px solid #f4626288; color: #f8a0a0; letter-spacing: 0.04em; }
.hint { font-size: 12.5px; color: var(--fg-3); }
.hint kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--fg-2); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--blue); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.dots {
  position: fixed; top: 50%; transform: translateY(-50%); right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 4px; z-index: 5;
}
.dots button {
  width: 24px; height: 24px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center;
}
.dots button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: transform 0.15s; }
.dots button[aria-current="true"]::before { background: var(--amber); transform: scale(1.4); }
.sound {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  font: 600 14px var(--sans); color: var(--bg); background: var(--amber); border: 0; border-radius: 999px;
  padding: 12px 20px; cursor: pointer; box-shadow: 0 6px 24px rgb(0 0 0 / 0.45);
}
.followup { margin-left: 6px; padding: 1px 7px; border-radius: 999px; border: 1px solid #4ad28c88; color: #8fe6b6; letter-spacing: 0.04em; }
/* Local mode only (served by serve.py): ask a follow-up by voice or text. */
.ask-bar {
  position: fixed; z-index: 6; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 18px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: min(720px, calc(100% - 100px)); box-sizing: border-box;
  background: rgb(11 15 23 / 0.92); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px;
}
.ask-bar[hidden] { display: none; }
.ask-bar button {
  font: 600 13px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid #5a6a88;
  border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 30px;
}
.ask-bar button[aria-pressed="true"] { border-color: var(--purple); color: var(--purple); }
.ask-bar input {
  flex: 1 1 200px; min-width: 0; font: 14px var(--sans); color: var(--fg); background: var(--panel);
  border: 1px solid #5a6a88; border-radius: 8px; padding: 6px 10px;
}
.ask-bar .msg { flex-basis: 100%; font-size: 12.5px; color: var(--fg-2); overflow-wrap: anywhere; }
.ask-bar .msg:empty { display: none; }
.rec { color: #f8a0a0; font-weight: 600; }
/* The ask bar takes a band at the bottom, so the video and its notes move up and stay clear of it. */
body.local .slide { padding-bottom: 112px; }
body.local .frame, body.local .notes { width: min(100%, calc((100dvh - 270px) * 16 / 9)); }
body.local .sound { bottom: 120px; }
@media (max-width: 760px) {
  .slide { padding-right: 44px; }
  .frame, .notes { width: 100%; }
  .notes p, .files, .hint { display: none; }
  h1, h2 { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .feed { scroll-behavior: auto; } }
</style>


<main class="feed" id="feed" aria-label="Video thread"></main>
<nav class="dots" id="dots" aria-label="Parts"></nav>
<button class="sound" id="sound" type="button">Play with sound</button>
<form class="ask-bar" id="askbar" hidden>
  <button type="button" id="mic" aria-pressed="false">🎙 Mic off</button>
  <label class="sr-only" for="asktext">Ask a follow-up</label>
  <input id="asktext" type="text" autocomplete="off" placeholder="Ask a follow-up (or pause and speak)">
  <button type="submit">Send</button>
  <span class="msg" id="askmsg" aria-live="polite"></span>
</form>
<p id="announce" class="sr-only" aria-live="polite"></p>

<script>
const feed = document.getElementById("feed");
const dots = document.getElementById("dots");
const soundBtn = document.getElementById("sound");
const announce = document.getElementById("announce");
const askbar = document.getElementById("askbar");
const micBtn = document.getElementById("mic");
const askText = document.getElementById("asktext");
const askMsg = document.getElementById("askmsg");
let PARTS = [];
let PAGE = {};
const slides = [];
const videos = [];
// Per part: the question pauses (seconds), the next one to stop at, and whether it is stopped at one now.
const asks = [];

let soundOn = false;
let current = 0;
let local = false;
let micStream = null;
let recorder = null;
let chunks = [];
let recFrom = null;

const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting && e.intersectionRatio > 0.6) activate(slides.indexOf(e.target));
}, { root: feed, threshold: [0.6] });

function addSlide(p, i) {
  const { title, summary: text, files, real, followup } = p;
  const n = i + 1;
  asks[i] = { times: p.pauses || [], next: 0, waiting: false };
  const s = document.createElement("section");
  s.className = "slide";
  s.id = `part-${n}`;
  s.setAttribute("aria-label", `Part ${n}: ${title}`);
  const H = i === 0 ? "h1" : "h2";
  const nq = asks[i].times.length;
  s.innerHTML = `
    <div class="frame">
      <video src="v/part-${n}.mp4" poster="p/part-${n}.jpg" playsinline muted preload="${i < 2 ? "auto" : "metadata"}"
        aria-label="Part ${n}: ${title}, narrated video with captions"></video>
      <div class="bar" aria-hidden="true"><i></i></div>
      <div class="state" hidden><span>Paused · click or Space to play</span></div>
      <div class="ask" hidden><span><b>Your guess?</b> Pick A, B or C, then click or press Space for the answer</span></div>
    </div>
    <div class="notes">
      <div class="eyebrow"><b>${PAGE.tag || ""}</b> · Part ${n}${real ? ` <span class="real">Real UI recording</span>` : ""}${followup ? ` <span class="followup">Follow-up</span>` : ""}${nq ? ` · ${nq} ${nq === 1 ? "question" : "questions"}` : ""}</div>
      <${H}></${H}>
      <p></p>
      <div class="files"></div>
      ${i === 0 ? `<p class="hint">Scroll or press <kbd>↓</kbd> <kbd>↑</kbd>. <kbd>Space</kbd> pauses. The video stops at each question until you continue. Each part moves on by itself when it ends. <a href="${PAGE.link}" target="_blank" rel="noopener">${PAGE.linkText || "Open the source"}</a>${PAGE.full ? ` · <a href="${PAGE.full}" target="_blank" rel="noopener">Watch as one video</a>` : ""}</p>` : ""}
    </div>`;
  s.querySelector(H).textContent = title;
  s.querySelector(".notes p").textContent = text;
  const fl = s.querySelector(".files");
  for (const f of files || []) { const c = document.createElement("code"); c.textContent = f; fl.appendChild(c); }
  feed.appendChild(s);

  const v = s.querySelector("video");
  const bar = s.querySelector(".bar i");
  const state = s.querySelector(".state");
  const ask = s.querySelector(".ask");
  const a = asks[i];
  const sync = () => { a.next = a.times.findIndex((t) => t > v.currentTime + 0.05); if (a.next < 0) a.next = a.times.length; };

  // timeupdate fires only about 4 times a second, so a frame loop catches the pause within one frame.
  const watch = () => {
    if (v.paused || v.ended) return;
    if (a.next < a.times.length && v.currentTime >= a.times[a.next]) {
      a.next += 1;
      a.waiting = true;
      v.pause();
      ask.hidden = false;
      announce.textContent = `Part ${n}: question. Pick an answer, then continue.`;
      return;
    }
    requestAnimationFrame(watch);
  };
  v.addEventListener("timeupdate", () => { bar.style.width = `${(v.currentTime / (v.duration || 1)) * 100}%`; });
  v.addEventListener("click", () => {
    if (!soundOn) { enableSound(); return; }
    toggle(i);
  });
  v.addEventListener("pause", () => {
    if (i !== current || v.ended || a.waiting) return;
    state.hidden = false;
    startRecording(i, v.currentTime);
  });
  v.addEventListener("play", () => {
    state.hidden = true; ask.hidden = true; a.waiting = false;
    stopRecording();
    requestAnimationFrame(watch);
  });
  v.addEventListener("seeked", sync);
  v.addEventListener("ended", () => { if (i < PARTS.length - 1) go(i + 1); });

  const d = document.createElement("button");
  d.type = "button";
  d.setAttribute("aria-label", `Part ${n}: ${title}`);
  d.addEventListener("click", () => go(i));
  dots.appendChild(d);
  slides[i] = s;
  videos[i] = v;
  io.observe(s);
}

function go(i) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  slides[i].scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}

function toggle(i) {
  const v = videos[i];
  if (v.paused) v.play().catch(() => {}); else v.pause();
}

function activate(i) {
  current = i;
  [...dots.children].forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
  videos.forEach((v, k) => {
    if (k !== i) { v.pause(); return; }
    v.muted = !soundOn;
    if (v.ended) { v.currentTime = 0; asks[k].next = 0; }
    v.play().catch(() => {});
  });
  if (videos[i + 1]) videos[i + 1].preload = "auto";
}

function enableSound() {
  soundOn = true;
  soundBtn.hidden = true;
  const v = videos[current];
  v.muted = false;
  // At a question, continue from it; else start the muted preview again with sound.
  if (!asks[current].waiting) { v.currentTime = 0; asks[current].next = 0; }
  v.play().catch(() => {});
}
soundBtn.addEventListener("click", enableSound);

document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("a, input")) return;
  if (["ArrowDown", "PageDown", "j"].includes(e.key)) { e.preventDefault(); go(Math.min(current + 1, slides.length - 1)); }
  else if (["ArrowUp", "PageUp", "k"].includes(e.key)) { e.preventDefault(); go(Math.max(current - 1, 0)); }
  else if (e.key === " " && !(e.target instanceof HTMLButtonElement)) {
    e.preventDefault();
    if (!soundOn) enableSound(); else toggle(current);
  }
});

// ---- local mode: follow-up requests by voice or text (served by serve.py; absent on claude.ai) ----
function say(text) { askMsg.textContent = text; }

async function send(body, type, part, at) {
  const p = PARTS[part] || {};
  const q = `part=${part + 1}&at=${at.toFixed(1)}&title=${encodeURIComponent(p.title || "")}`;
  say("Sending…");
  try {
    const r = await fetch(`ask?${q}`, { method: "POST", headers: { "Content-Type": type }, body });
    const j = await r.json();
    if (!r.ok) { say(`Not sent: ${j.error || r.status}`); return; }
    if (j.status === "empty") { say("Heard nothing. Pause and speak again."); return; }
    say(`${j.status === "queued" ? "Queued (no Claude session listens)" : "Sent to Claude"}: “${j.text}”`);
    pollRequests();
  } catch { say("Not sent: the local server does not answer."); }
}

function startRecording(part, at) {
  if (!micStream || recorder) return;
  chunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recFrom = { part, at, t0: performance.now() };
  recorder.onstop = () => {
    const { part: pt, at: when, t0 } = recFrom;
    recorder = null;
    if (performance.now() - t0 < 1000 || !chunks.length) { say(""); return; }
    const blob = new Blob(chunks, { type: chunks[0].type || "audio/webm" });
    send(blob, blob.type, pt, when);
  };
  recorder.start();
  askMsg.innerHTML = '<span class="rec">● Recording</span> — speak, then press play to send';
}

function stopRecording() { if (recorder && recorder.state !== "inactive") recorder.stop(); }

micBtn.addEventListener("click", async () => {
  if (micStream) {
    stopRecording();
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
    micBtn.setAttribute("aria-pressed", "false"); micBtn.textContent = "🎙 Mic off"; say("");
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micBtn.setAttribute("aria-pressed", "true"); micBtn.textContent = "🎙 Mic on";
    say("Pause the video and speak. Press play to send.");
  } catch { say("No microphone access. Type the question instead."); }
});

askbar.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = askText.value.trim();
  if (!text) return;
  askText.value = "";
  send(text, "text/plain;charset=utf-8", current, videos[current] ? videos[current].currentTime : 0);
});

let requests = [];
let attached = false;
function pending() {
  const answered = new Set(PARTS.map((p) => p.request).filter(Boolean));
  const live = ["sending", "sent", "delivered"].concat(attached ? ["queued"] : []);
  return requests.filter((r) => live.includes(r.status) && !answered.has(r.id)).length;
}
function showPending() {
  const n = pending();
  micBtn.title = n ? `${n} follow-up(s) in progress` : "";
  if (n && !recorder && !askMsg.textContent.startsWith("Sending")) {
    const base = askMsg.textContent.replace(/ · \d+ follow-ups? in progress$/, "");
    askMsg.textContent = `${base}${base ? " · " : ""}${n} follow-up${n === 1 ? "" : "s"} in progress`;
  }
}
const DETACHED = "No Claude session listens: requests are queued.";
function showAttached(on) {
  attached = Boolean(on);
  if (!attached && !askMsg.textContent) say(DETACHED);
  if (attached && askMsg.textContent === DETACHED) say("");
}
async function pollAttached() {
  try { showAttached((await (await fetch("local.json", { cache: "no-store" })).json()).session); } catch {}
}
async function pollRequests() {
  try { requests = (await (await fetch("requests.json", { cache: "no-store" })).json()).requests; showPending(); } catch {}
}

async function pollParts() {
  try {
    const cfg = await (await fetch("parts.json", { cache: "no-store" })).json();
    const before = PARTS.length;
    if (cfg.parts.length <= before) return;
    PARTS = cfg.parts;
    for (let i = before; i < PARTS.length; i++) addSlide(PARTS[i], i);
    const added = PARTS.length - before;
    announce.textContent = `${added} new follow-up part${added === 1 ? "" : "s"} at the end of the feed.`;
    say(`New: ${PARTS.slice(before).map((p) => p.title).join(" · ")} (at the end)`);
    showPending();
  } catch {}
}

fetch("parts.json").then((r) => r.json()).then((cfg) => {
  PAGE = cfg.page || {};
  PARTS = cfg.parts;
  if (PAGE.title) document.title = PAGE.title;
  PARTS.forEach((p, i) => addSlide(p, i));
  const start = /^#part-(\d{1,3})$/.exec(location.hash);
  if (start && !slides[Number(start[1]) - 1]) start[1] = "1";
  if (start) slides[Number(start[1]) - 1].scrollIntoView({ block: "start" });
  activate(start ? Number(start[1]) - 1 : 0);
  fetch("local.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((j) => {
    if (!j || !j.local) return;
    local = true;
    document.body.classList.add("local");
    askbar.hidden = false;
    showAttached(j.session);
    setInterval(pollAttached, 5000);
    setInterval(pollParts, 5000);
    setInterval(pollRequests, 5000);
    pollRequests();
  }).catch(() => {});
});
</script>
